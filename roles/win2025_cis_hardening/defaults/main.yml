---
# win2025_cis_hardening role defaults
#
# win2025cis_level: which CIS profile level(s) to apply.
#   1 -> only Level 1 controls
#   2 -> Level 1 AND Level 2 controls (default - full Member Server hardening)
win2025cis_level: 2

# Org-specific values referenced by vars/*.yml via data_var/value_var.
# Sensible safe defaults are provided; override in group_vars/host_vars as needed.
win2025cis_rename_administrator_account: LocalAdmin
win2025cis_rename_guest_account: LocalGuest
win2025cis_legal_notice_caption: "Authorized Use Only"
win2025cis_legal_notice_text: >-
  This system is restricted to authorized users for authorized business purposes only.
  Unauthorized access or use of this system is prohibited and may be subject to criminal
  and/or civil penalties. All activity may be monitored and recorded.
win2025cis_firewall_domain_log_path: '%SystemRoot%\System32\logfiles\firewall\domainfw.log'
win2025cis_firewall_private_log_path: '%SystemRoot%\System32\logfiles\firewall\privatefw.log'
win2025cis_firewall_public_log_path: '%SystemRoot%\System32\logfiles\firewall\publicfw.log'

# ---------------------------------------------------------------------------
# SELECCION DE SECCIONES CIS A EJECUTAR
# Por defecto se ejecutan TODAS. En AWX se eligen al lanzar con la encuesta
# (Survey) "Secciones CIS a ejecutar" (ver docs/awx_survey_secciones.json).
# Por CLI:  -e '{"win2025cis_secciones": ["1", "17"]}'   o   -e win2025cis_secciones=1,17
# Se aceptan valores "1" o "1 - Politicas de cuenta" (se toma el numero inicial).
#   1  - Politicas de cuenta (contrasenas y bloqueo)
#   2  - Politicas locales (derechos de usuario y opciones de seguridad)
#   5  - Servicios del sistema
#   9  - Firewall de Windows Defender
#   17 - Politica de auditoria avanzada
#   18 - Plantillas administrativas (equipo)
#   19 - Plantillas administrativas (usuario)
# ---------------------------------------------------------------------------
win2025cis_secciones: ["1", "2", "5", "9", "17", "18", "19"]

# Calculado - no modificar (normaliza lista / texto separado por comas / etiquetas).
win2025cis_secciones_activas: '{{ ((win2025cis_secciones.split(",") if win2025cis_secciones is string else win2025cis_secciones) | default([], true)) | map("string") | map("trim") | map("regex_search", "^[0-9]+") | select | unique | list }}'

# ---------------------------------------------------------------------------
# CONTROLES CON RIESGO PARA LA CONEXION DE ANSIBLE (WinRM)
# Ansible administra este servidor por WinRM (HTTPS 5986, NTLM) usando WinRS.
# Los siguientes controles NO SE RECOMIENDA ejecutarlos desde Ansible, o solo
# con validacion previa, porque pueden dejar a Ansible SIN CONEXION:
#
# NO RECOMENDADOS (cortan la conexion siempre) -> estan en PENDIENTES:
#   18.10.90.2.2  Allow remote server management through WinRM = Disabled
#                 Justificacion: el servicio WinRM deja de aceptar conexiones
#                 remotas; Ansible, AWX y PowerShell remoting quedan fuera.
#                 Alternativa: aplicarlo por GPO de AD con excepcion para la
#                 subred/servidor de AWX, o documentar la excepcion CIS.
#   18.10.91.1    Allow Remote Shell Access = Disabled
#                 Justificacion: deshabilita WinRS (shell remoto de WinRM).
#                 Todos los modulos de Ansible para Windows se ejecutan dentro
#                 de un shell WinRS; sin el, ningun modulo funciona.
#                 Alternativa: la misma que el anterior (GPO + excepcion).
#
# CON VALIDACION PREVIA (pueden cortar la conexion segun el entorno):
#   18.6.19.2.1   Disable IPv6 -> PENDIENTE. Requiere reinicio; si el listener
#                 WinRM, DNS o alguna aplicacion usa IPv6, se pierde el acceso.
#   9.1.1 / 9.2.1 / 9.3.1  Firewall state = On (hoy win2025cis_rule_* = false).
#                 Justificacion: 9.x.2 ya fija "bloquear entrantes por defecto";
#                 al encender el firewall, si no existe una regla que permita
#                 TCP 5986 desde AWX, WinRM queda bloqueado. Crear la regla antes.
#   9.3.4         Public profile: Apply local firewall rules = No.
#                 Justificacion: si la red queda en perfil Publico (servidor sin
#                 dominio), se ignora la regla local del 5986. (PENDIENTE en lab.)
#   18.4.1        UAC restrictions for local accounts on network logons.
#                 Justificacion: bloquea el acceso por red de administradores
#                 LOCALES. Sin problema si Ansible usa cuenta de DOMINIO.
#                 (PENDIENTE en lab.)
#   2.2.21        Deny access from network: "Local account and member of
#                 Administrators" (hoy win2025cis_rule_2_2_21 = false).
#                 Justificacion: igual que 18.4.1, afecta cuentas LOCALES.
#   2.3.1.3       Rename administrator account.
#                 Justificacion: si ansible_user es "Administrator", despues
#                 del cambio ese usuario ya no existe y la conexion falla.
#   1.2.2         Account lockout threshold (5 intentos).
#                 Justificacion: con cuenta local, 5 contrasenas erradas desde
#                 Ansible/AWX bloquean la cuenta 15 minutos.
#   2.3.11.6 / 2.3.11.9 / 2.3.11.10  NTLMv2 obligatorio y seguridad minima de
#                 sesion NTLM (128 bits). Justificacion: el nodo de Ansible
#                 necesita pywinrm/pyspnego actualizados; versiones antiguas
#                 fallan la autenticacion NTLM.
#   18.10.90.2.1 / 18.10.90.2.3  WinRM service: sin Basic / sin trafico sin
#                 cifrar. Justificacion: solo afectan si Ansible usa Basic o
#                 HTTP 5985; con NTLM sobre HTTPS 5986 no hay impacto.
# En vars/section*.yml cada uno de estos controles tiene encima un comentario
# "# >>> PENDIENTE" o "# >>> PRECAUCION ANSIBLE".
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CONTROLES CIS "PENDIENTES"
# Controles contemplados en el rol que NO se aplican por ahora, porque
# cortarian la conexion de Ansible (WinRM) o requieren una validacion previa.
# En cada ejecucion se reportan como "PENDIENTE <id> | motivo" al llegar a su
# seccion, y de nuevo en un resumen al final del rol (evidencia para auditoria).
#
# - Para APLICAR uno bajo demanda, sin tocar este archivo, pasar su id en
#   win2025cis_aplicar_pendientes. Ejemplo (CLI o Extra Variables de AWX):
#     -e '{"win2025cis_aplicar_pendientes": ["18.6.19.2.1"]}'
# - Para agregar pendientes SOLO en un ambiente (lab, un servidor puntual),
#   usar win2025cis_controles_pendientes_extra en el inventario o host_vars.
#   No redefinir win2025cis_controles_pendientes fuera de este archivo.
# ---------------------------------------------------------------------------
# COMO USARLO (tipo "hashtag"):
#   - Linea ACTIVA      -> el control se OMITE (no se ejecuta) y se reporta como PENDIENTE.
#   - Linea con # delante -> el control vuelve a ejecutarse normalmente.
win2025cis_controles_pendientes:
  "18.10.90.2.2": "Allow remote server management through WinRM = Disabled -> WinRM deja de escuchar y Ansible pierde el acceso. Retomar via GPO de AD o excepcion documentada."
  "18.10.91.1": "Allow Remote Shell Access = Disabled -> deshabilita WinRS y Ansible no puede ejecutar modulos. Retomar via GPO de AD o excepcion documentada."
  "18.6.19.2.1": "Disable IPv6 (DisabledComponents = 0xFF) -> requiere reinicio y validar servicios que dependan de IPv6 antes de aplicarlo."

# Pendientes adicionales por ambiente (se suman a la lista anterior).
win2025cis_controles_pendientes_extra: {}

# Ids de pendientes que SI se quieren aplicar en esta ejecucion (bajo demanda).
win2025cis_aplicar_pendientes: []

# Calculados - no modificar.
win2025cis_pendientes_detalle: "{{ (win2025cis_controles_pendientes | default({}, true)) | combine(win2025cis_controles_pendientes_extra | default({}, true)) }}"
win2025cis_pendientes_activos: "{{ win2025cis_pendientes_detalle.keys() | list | difference(win2025cis_aplicar_pendientes | default([], true)) }}"

# ---------------------------------------------------------------------------
# CONTROLES CIS CON "OBSERVACION"
# A diferencia de los PENDIENTES, estos SI se aplican. Quedan anotados porque
# el valor exacto que aplica el rol cumple el minimo de CIS pero puede ser MAS
# DEBIL que el que ya tiene el servidor/banco, o reemplaza configuracion
# existente. Se reportan como "OBSERVACION <id> | comentario" al terminar su
# seccion y en el resumen final, para retomarlos (ajustar valores en vars/).
# Para excluir uno de la ejecucion: win2025cis_rule_<id>: false
# ---------------------------------------------------------------------------
win2025cis_controles_observaciones:
  "1.1.2": "Maximum password age: el rol aplica 365 dias (minimo CIS). En 10.110.9.187 estaba en 45 (mas estricto). Revisar si se mantiene el valor del banco."
  "1.2.1": "Account lockout duration: el rol aplica 15 min. En 10.110.9.187 estaba en 1440 (mas estricto). Revisar."
  "1.2.2": "Account lockout threshold: el rol aplica 5 intentos. En 10.110.9.187 estaba en 3 (mas estricto). Revisar."
  "1.2.4": "Reset account lockout counter: el rol aplica 15 min. En 10.110.9.187 estaba en 1440. Revisar."
  # 18.10.26.2.2 retirado de observaciones (2026-09-30): el rol ahora fija 2.097.152 KB, igual que la GPO del banco.
  "17.5.1": "Audit Account Lockout: CIS pide 'incluir Failure'; el rol deja SOLO Failure y quita Success si ya estaba. Revisar para no perder auditoria."
  "17.5.3": "Audit Logoff: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.5.6": "Audit Special Logon: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.6.1": "Audit Detailed File Share: el rol deja SOLO Failure y quita Success si ya estaba. Revisar."
  "17.7.1": "Audit Audit Policy Change: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.7.2": "Audit Authentication Policy Change: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.7.3": "Audit Authorization Policy Change: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.7.5": "Audit Other Policy Change Events: el rol deja SOLO Failure y quita Success si ya estaba. Revisar."
  "17.8.1": "Audit Sensitive Privilege Use: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.9.3": "Audit Security State Change: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."
  "17.9.4": "Audit Security System Extension: el rol deja SOLO Success y quita Failure si ya estaba. Revisar."

# Observaciones adicionales por ambiente (se suman a la lista anterior).
win2025cis_controles_observaciones_extra: {}

# Calculado - no modificar.
win2025cis_observaciones_detalle: "{{ (win2025cis_controles_observaciones | default({}, true)) | combine(win2025cis_controles_observaciones_extra | default({}, true)) }}"

# Limpieza (2026-09-30): elimina las 5 claves de registro con nombre invalido que
# crearon versiones anteriores de 18.6.9.1, 18.6.9.2, 18.6.20.1, 18.10.77.2.1 y
# 18.10.94.4.2 (ver vars/section18: win2025cis_section18_registry_cleanup_keys).
# Es idempotente (si no existen, sale ok). Poner false para no ejecutarla.
win2025cis_limpiar_claves_invalidas: true

