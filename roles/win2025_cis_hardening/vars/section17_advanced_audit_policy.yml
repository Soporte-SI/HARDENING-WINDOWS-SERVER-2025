---
# Section 17 - Advanced Audit Policy Configuration (CIS Microsoft Windows
# Server 2025 Benchmark v2.1.0)
# Implemented via ansible.windows.win_audit_policy_system (subcategory +
# audit_type: success/failure), which wraps auditpol.exe and is idempotent
# (module checks the current subcategory setting before changing it).
# DC-only subcategories (e.g. Audit Kerberos Authentication Service, Audit
# Directory Service Access) are excluded here - see docs/coverage_matrix.csv.
# Note: 2.3.2.1 (section 2) sets "Force audit policy subcategory settings to
# override audit policy category settings" to Enabled, which is a
# prerequisite for these subcategory settings to take effect.
win2025cis_section17_audit_items:
