---
# Section 2 - Local Policies (CIS Microsoft Windows Server 2025 Benchmark v2.1.0)
# 2.2 User Rights Assignment (ansible.windows.win_user_right)
# 2.3 Security Options (mix of community.windows.win_security_policy / ansible.windows.win_regedit)
#
# Notes:
# - 2.3.11.7 and 2.3.11.8 ("LDAP client encryption requirements" / "LDAP client signing requirements")
#   both map to the same registry value (LDAPClientIntegrity) per Microsoft documentation; CIS lists them
#   as two separate recommendation IDs but they configure the same underlying control.
# - 2.3.1.3 / 2.3.1.4 (rename administrator/guest account) use org-specific values, see group_vars/windows.yml.
win2025cis_section2_user_rights:
