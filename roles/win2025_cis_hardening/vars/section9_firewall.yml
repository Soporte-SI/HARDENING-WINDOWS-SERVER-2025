---
# Section 9 - Windows Defender Firewall with Advanced Security (CIS Microsoft
# Windows Server 2025 Benchmark v2.1.0)
# Implemented via ansible.windows.win_regedit against the GPO-backed registry
# locations Microsoft documents for these "Windows Defender Firewall
# Properties" settings:
#   HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\<Domain|Private|Public>Profile
#   HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\<Profile>Profile\Logging
# (This is distinct from individual inbound/outbound rules, which the CIS
# benchmark does not mandate specific values for at this level and would be
# managed with community.windows.win_firewall_rule instead.)
# Log file path/name is organization-specific; override
# win2025cis_firewall_<profile>_log_path in group_vars if needed.
win2025cis_section9_firewall_items:
- id: 9.1.1
  level: 1
  title: 'Windows Firewall: Domain: Firewall state'
  path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
  name: EnableFirewall
  data: 1
  type: dword
- id: 9.1.2
  level: 1
  title: 'Windows Firewall: Domain: Inbound connections'
  path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
  name: DefaultInboundAction
  data: 1
  type: dword
- id: 9.1.3
  level: 1
  title: 'Windows Firewall: Domain: Settings: Display a notification'
  path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
  name: DisableNotifications
  data: 1
  type: dword
- id: 9.1.4
  level: 1
  title: 'Windows Firewall: Domain: Logging: Name'
  path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\Logging
  name: LogFilePath
  data_var: win2025cis_firewall_domain_log_path
