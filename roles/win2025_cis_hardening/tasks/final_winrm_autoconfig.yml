---
# CIS 18.10.90.2.2 - Ensure 'Allow remote server management through WinRM' is
# set to 'Disabled' (registry: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service,
# AllowAutoConfig = 0).
#
# ADVERTENCIA OPERATIVA: este control DEBE ser el ULTIMO que se aplica en
# TODO el rol (por eso vive en su propio archivo, incluido al final de
# tasks/main.yml, despues incluso de la Seccion 19). A diferencia del
# renombrado de cuentas (2.3.1.3/2.3.1.4, que ya se soluciona con la cuenta
# de servicio dedicada exigida por el PREFLIGHT de tasks/main.yml), este
# control reconfigura el propio SERVICIO WinRM que sostiene el listener por
# el que Ansible esta conectado - no importa con que cuenta te conectes, el
# riesgo es de TRANSPORTE, no de credenciales.
#
# Si el listener de este host fue creado/se mantiene via auto-configuracion
# de GPO (AllowAutoConfig=1), deshabilitarlo puede tumbar la sesion activa
# de WinRM en cuanto se aplica (sintoma: "ntlm: the specified credentials
# were rejected by the server" o "unreachable" en la tarea siguiente, aunque
# la cuenta y el password sean correctos). Si eso pasa aqui, es el
# comportamiento esperado de ESTE control puntual, no un error del playbook -
# todo lo demas ya se aplico antes.
#
# Recomendaciones:
# - Corre este control en una ejecucion separada al final de la ventana de
#   mantenimiento (`--tags 18.10.90.2.2`), no como parte de una corrida larga
#   donde perder la conexion aqui te obligue a repetir todo.
# - Verifica que el listener de WinRM del host NO dependa de auto-config de
#   GPO antes de aplicarlo en produccion (ej. listener creado manualmente con
#   `winrm quickconfig` / `New-Item WSMan:\localhost\Listener` no deberia
#   verse afectado).
# - Si prefieres posponerlo, deshabilita el toggle
#   (`win2025cis_rule_18_10_90_2_2: false` en group_vars/host_vars).
- name: "CIS 18.10.90.2.2 - Configure WinRM Service AllowAutoConfig (ULTIMO paso del rol)"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service
    name: AllowAutoConfig
    data: 0
    type: dword
  when:
    - win2025cis_level >= 2
    - (lookup('vars', 'win2025cis_rule_18_10_90_2_2', default=true))
  tags: ["18.10.90.2.2"]
