- name: "CIS 18.x - Configure Administrative Templates (Computer) - REG_SZ values"
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: string
  loop: "{{ win2025cis_section18_registry_string_items | default([]) }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
    and item.id not in win2025cis_pendientes_activos
  tags: ["section18", "administrative_templates_computer", "18.5.1", "18.6.14.1", "18.6.14.1", "18.10.26.1.1", "18.10.26.2.1", "18.10.26.3.1", "18.10.26.4.1"]
  notify: Run gpupdate

- name: "CIS 18.x - Configure Administrative Templates (Computer) - values that must be absent"
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    state: absent
  loop: "{{ win2025cis_section18_registry_absent_items | default([]) }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
    and item.id not in win2025cis_pendientes_activos
  tags: ["section18", "administrative_templates_computer", "18.9.19.5"]
  notify: Run gpupdate

- name: "OBSERVACIONES | Seccion 18 - controles aplicados que quedan anotados para revision"
  ansible.builtin.debug:
    msg: "OBSERVACION {{ item }} | {{ win2025cis_observaciones_detalle[item] }}"
  loop: "{{ win2025cis_observaciones_detalle.keys() | list | select('match', '^18\\.') | list }}"
  tags: ["section18", "observaciones"]
