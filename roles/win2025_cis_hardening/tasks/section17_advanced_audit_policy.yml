---
# Section 17 - Advanced Audit Policy Configuration
# Exception toggle for control X.Y.Z: win2025cis_rule_X_Y_Z (see defaults/main.yml)
# Prerequisite: CIS 2.3.2.1 ("Force audit policy subcategory settings to
# override audit policy category settings") must be Enabled - see section2 -
# for these subcategory settings to be honoured over any legacy category
# audit policy.

- name: "CIS 17.x - Configure Advanced Audit Policy subcategories"
  ansible.windows.win_audit_policy_system:
    subcategory: "{{ item.subcategory }}"
    audit_type: "{{ item.audit_type }}"
  loop: "{{ win2025cis_section17_audit_items }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
  tags: ["section17", "audit_policy", "17.1.1", "17.2.1", "17.2.5", "17.2.6", "17.3.1", "17.3.2", "17.5.1", "17.5.2", "17.5.3", "17.5.4", "17.5.5", "17.5.6", "17.6.1", "17.6.2", "17.6.3", "17.6.4", "17.7.1", "17.7.2", "17.7.3", "17.7.4", "17.7.5", "17.8.1", "17.9.1", "17.9.2", "17.9.3", "17.9.4", "17.9.5"]