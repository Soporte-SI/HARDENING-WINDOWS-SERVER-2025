---
# Section 2 - Local Policies (User Rights Assignment / Security Options)
# Exception toggle for control X.Y.Z: win2025cis_rule_X_Y_Z (see defaults/main.yml)

- name: "CIS 2.2 - Configure User Rights Assignment"
  ansible.windows.win_user_right:
    name: "{{ item.name }}"
    users: "{{ item.users }}"
    action: set
  loop: "{{ win2025cis_section2_user_rights }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
  tags: ["section2", "local_policies", "security_options", "2.2.1", "2.2.3", "2.2.4", "2.2.6", "2.2.8", "2.2.10", "2.2.11", "2.2.12", "2.2.13", "2.2.14", "2.2.15", "2.2.16", "2.2.18", "2.2.19", "2.2.21", "2.2.22", "2.2.23", "2.2.24", "2.2.26", "2.2.28", "2.2.29", "2.2.30", "2.2.32", "2.2.33", "2.2.34", "2.2.35", "2.2.38", "2.2.39", "2.2.40", "2.2.41", "2.2.42", "2.2.43", "2.2.44", "2.2.45", "2.2.46", "2.2.48"]
- name: "CIS 2.3 - Configure Security Options (secedit System Access)"
  community.windows.win_security_policy:
    section: System Access
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ win2025cis_section2_secedit_items }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
  tags: ["section2", "local_policies", "security_options", "2.3.1.1", "2.3.10.1", "2.3.11.5"]
# 2.3.1.3/2.3.1.4 (rename Administrator/Guest accounts) is safe to run here,
# in its natural place, because tasks/main.yml has a PREFLIGHT assertion that
# refuses to run this role at all if ansible_user is Administrator/Guest -
# so the account being renamed is never the one Ansible is authenticated as.
- name: "CIS 2.3.1.3/2.3.1.4 - Rename Administrator/Guest accounts (org-specific, see group_vars)"
  community.windows.win_security_policy:
    section: System Access
    key: "{{ item.key }}"
    value: "{{ lookup('vars', item.value_var) }}"
  loop: "{{ win2025cis_section2_rename_items }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
  tags: ["section2", "local_policies", "security_options", "2.3.1.3", "2.3.1.4"]
- name: "CIS 2.3 - Configure Security Options (registry)"
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ (lookup('vars', item.data_var)) if item.data_var is defined else item.data }}"
    type: "{{ item.type }}"
  loop: "{{ win2025cis_section2_registry_items }}"
  loop_control:
    label: "{{ item.id }} - {{ item.title }}"
  when: >-
    win2025cis_level >= item.level and
    (lookup('vars', 'win2025cis_rule_' + (item.id | regex_replace('\.', '_')), default=true))
  tags: ["section2", "local_policies", "security_options", "2.3.1.2", "2.3.2.1", "2.3.2.2", "2.3.4.1", "2.3.6.1", "2.3.6.2", "2.3.6.3", "2.3.6.4", "2.3.6.5", "2.3.6.6", "2.3.7.1", "2.3.7.2", "2.3.7.3", "2.3.7.4", "2.3.7.5", "2.3.7.6", "2.3.7.7", "2.3.7.8", "2.3.7.9", "2.3.8.1", "2.3.8.2", "2.3.9.1", "2.3.9.2", "2.3.9.3", "2.3.9.4", "2.3.10.2", "2.3.10.3", "2.3.10.4", "2.3.10.5", "2.3.10.7", "2.3.10.8", "2.3.10.9", "2.3.10.10", "2.3.10.11", "2.3.10.12", "2.3.10.13", "2.3.11.1", "2.3.11.2", "2.3.11.3", "2.3.11.4", "2.3.11.6", "2.3.11.7", "2.3.11.8", "2.3.11.9", "2.3.11.10", "2.3.11.11", "2.3.11.13", "2.3.13.1", "2.3.15.1", "2.3.15.2", "2.3.17.1", "2.3.17.2", "2.3.17.3", "2.3.17.4", "2.3.17.5", "2.3.17.6", "2.3.17.7", "2.3.17.8"]
  notify: Run gpupdate
