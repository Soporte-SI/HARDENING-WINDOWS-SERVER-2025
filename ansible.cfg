[defaults]
inventory = inventory/hosts.ini
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent

[inventory]
# CORRECCION 2026-09-01: faltaba "script" en la lista - sin el, AWX no puede
# ejecutar el inventario dinamico que genera para cada job
# (/runner/inventory/hosts), y Ansible cae a intentar leerlo como texto plano
# con los plugins ini/yaml, lo que produce el error "range must be
# begin:end or begin:end:step" (el plugin ini interpreta los corchetes del
# JSON como un rango de hosts) seguido de "Unable to parse ... as an
# inventory source". Ver Job Templates "test conexion windows" (jobs
# 101/104/105) para el detalle del fallo.
enable_plugins = script, ini, yaml, auto

[privilege_escalation]
become = False

[callback_default]
result_format = default
