; Copy this file to hosts.ini (or pass -i explicitly) and adjust to your environment.
; hosts.ini is intentionally NOT meant to be committed with real hostnames/IPs.

[windows]
192.168.5.4

[windows:vars]
ansible_connection=winrm
ansible_port=5986
#ansible_winrm_transport=credssp
; Alternative if CredSSP is not configured on the target: ntlm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
; Only "ignore" for lab/self-signed certs - use "validate" in production with a
; proper CA-issued WinRM listener certificate.
ansible_user=Administrator
#ansible_password="{{ vault_windows_admin_password }}"
ansible_password="Windows."
; Prefer ansible-vault (or an external secrets manager) over a plaintext
; password committed to the inventory.
